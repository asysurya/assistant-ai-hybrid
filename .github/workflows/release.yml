# ============================================================
# AssistantAI — GitHub Actions: Release
# ------------------------------------------------------------
# Trigger : push tag v*   (contoh: git tag v1.0.0 && git push origin v1.0.0)
# Catatan : butuh assistant.spec (FASE 11) — tunda tag rilis sebelum fase itu.
#           Rilis utama x64; ARM64 ikut artifact dari workflow Build.
# ============================================================

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write          # izin membuat Release + upload aset

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Jalankan test
        run: python -m pytest tests/ -v

      - name: Build binary (.exe)
        run: pyinstaller assistant.spec --clean --noconfirm

      - name: Buat ZIP portable
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AssistantAI.exe,README.md,LICENSE -DestinationPath AssistantAI-Portable.zip

      - name: Buat GitHub Release + upload aset
        uses: softprops/action-gh-release@v1
        with:
          files: |
            AssistantAI-Portable.zip
            dist/AssistantAI.exe
          generate_release_notes: true
